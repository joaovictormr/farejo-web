<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinindo senha — Farejô</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#4a8072">
  <link rel="icon" type="image/png" href="../assets/images/icon.png">
  <link rel="apple-touch-icon" href="../assets/images/icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <script>
    // Captura a query string completa (incluindo o token) e redireciona ao preview
    (function () {
      var queryString = window.location.search || '';
      var target = 'https://preview.farejoapp.com.br/reset-password' + queryString;
      window.location.replace(target);
    })();
  </script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --color-primary: #4a8072;
      --color-success: #6fc04d;
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-success) 100%);
      color: #fff;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 360px;
      text-align: center;
      padding: 40px 32px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.25);
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      background: #fff;
      border-radius: 22px;
      box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .logo img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .message {
      font-size: 0.9375rem;
      opacity: 0.92;
      line-height: 1.5;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 28px auto 0;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: rgba(255, 255, 255, 0.6); }
    }

    .fallback {
      display: none;
      margin-top: 20px;
      font-size: 0.875rem;
    }

    .fallback a {
      color: #fff;
      font-weight: 700;
      text-decoration: underline;
    }

    noscript {
      display: block;
      margin-top: 20px;
      padding: 16px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      font-size: 0.875rem;
    }

    noscript a {
      color: #fff;
      font-weight: 700;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="card" role="status" aria-live="polite">
    <div class="logo">
      <img src="../assets/images/icon.png" alt="Farejô">
    </div>
    <h1>Redirecionando...</h1>
    <p class="message">Estamos te levando para a página de redefinição de senha.</p>
    <div class="spinner" aria-hidden="true"></div>

    <p class="fallback" id="fallback">
      Não foi redirecionado?
      <a id="fallback-link" href="https://preview.farejoapp.com.br/reset-password">Clique aqui</a>
    </p>

    <noscript>
      <strong>JavaScript desabilitado.</strong>
      Por favor, <a href="https://preview.farejoapp.com.br/reset-password">clique aqui</a> para continuar.
    </noscript>
  </main>

  <script>
    // Mostra link manual depois de 3s caso o redirect automático falhe.
    setTimeout(function () {
      var link = document.getElementById('fallback-link');
      var box = document.getElementById('fallback');
      if (link && box) {
        link.href = 'https://preview.farejoapp.com.br/reset-password' + (window.location.search || '');
        box.style.display = 'block';
      }
    }, 3000);
  </script>
</body>
</html>
